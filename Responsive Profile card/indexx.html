<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Responsive Design Exercises</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page-container">

    <!-- Navigation -->
    <header class="navbar">

      <div class="logo">MySite</div>

      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </nav>

      <button class="menu-btn" aria-label="Toggle Navigation Menu">
        ☰
      </button>

    </header>


    <!-- Exercise 1-->
    <section>

      <article class="profile-card">

        <img
          class="profile-img"
          src="https://i.pinimg.com/736x/1b/61/28/1b61281045af5c832a0948c449da8f8a.jpg"
          alt="Lee Sivheng Profile Picture"
        >

        <h3 class="profile-name">
          Lee Sivheng
        </h3>

        <p class="profile-bio">
          Cybersecurity girl with OCD.
        </p>

      </article>

    </section>


    <!-- Exercise 2 -->
    <section>

      <div class="grid">

        <div class="box box-1">Box 1</div>
        <div class="box box-2">Box 2</div>
        <div class="box box-3">Box 3</div>
        <div class="box box-4">Box 4</div>

      </div>

    </section>

  </main>

</body>

</html>
